name: Deploy server lisensi (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['server/lisensi/**', '.github/workflows/lisensi.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      ADMIN_KUNCI: ${{ secrets.ADMIN_KUNCI }}
    defaults:
      run:
        working-directory: server/lisensi
    steps:
      - uses: actions/checkout@v4
      - name: Cek secret
        id: cek
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ] || [ -z "$ADMIN_KUNCI" ]; then
            echo "Secret Cloudflare belum lengkap, deploy dilewati. Lihat LISENSI.md." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cek.outputs.ok == '1'
        with:
          node-version: 22
      - name: Deploy
        if: steps.cek.outputs.ok == '1'
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml
          npx -y wrangler@4 deploy
          printf '%s' "$ADMIN_KUNCI" | npx -y wrangler@4 secret put ADMIN_KUNCI
