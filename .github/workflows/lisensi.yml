name: Deploy server lisensi (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['server/lisensi/**', '.github/workflows/lisensi.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KUNCI: ${{ secrets.ADMIN_KUNCI }}
    defaults:
      run:
        working-directory: server/lisensi
    steps:
      - uses: actions/checkout@v4
      - name: Cek secret
        id: cek
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$ADMIN_KUNCI" ]; then
            echo "Secret Cloudflare belum lengkap, deploy dilewati. Lihat LISENSI.md." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cek.outputs.ok == '1'
        with:
          node-version: 22
      - name: Deploy
        if: steps.cek.outputs.ok == '1'
        run: |
          npx -y wrangler@4 deploy
          printf '%s' "$ADMIN_KUNCI" | npx -y wrangler@4 secret put ADMIN_KUNCI
      - name: Terbitkan ulang web dengan paywall aktif
        if: steps.cek.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
