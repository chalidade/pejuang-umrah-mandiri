name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ambil kunci publik lisensi
        if: ${{ vars.LISENSI_API != '' }}
        run: |
          PUB=$(curl -fsS "${{ vars.LISENSI_API }}/kunci-publik" | jq -c .jwk || true)
          [ "$PUB" = "null" ] && PUB=""
          echo "VITE_LISENSI_PUBKEY=$PUB" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          BASE_PATH: /
          VITE_LISENSI_API: ${{ vars.LISENSI_API }}
          VITE_LISENSI_BELI: ${{ vars.LISENSI_BELI }}
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pejuangumrah.my.id
